<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENAI Inclusão - Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="mobile-container">
    
    <!-- Top Header -->
    <header class="top-header">
      <div class="logo-area">
        <div class="logo-symbol">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="logo-text">
          <span>SENAI</span> <strong>Inclusão</strong>
        </div>
      </div>

      <div class="header-actions">
        <button id="btn-accessibility" class="acc-badge" title="Acessibilidade">Aa</button>
        <button class="notification-btn" title="Notificações">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="badge-dot"></span>
        </button>
      </div>
    </header>

    <!-- Welcome Card Banner -->
    <section class="user-welcome-card">
      <p class="greeting">Bom dia,</p>
      <h1 class="user-name">Olá, Jhon</h1>
      <span class="registration-id">Matrícula 20241038</span>
    </section>

    <!-- Mapa / Ver Rotas Card -->
    <section class="route-card">
      <div class="route-header">
        <div class="map-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#006DB6" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
        </div>
        <div class="route-title">
          <h2>Ver Rotas</h2>
          <p>Veja sua rota para ver o seu destino na escola.</p>
        </div>
      </div>
      
      <button class="btn-routes" id="btn-routes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>Acessar Rotas</span>
      </button>
    </section>

    <!-- Seção de Serviços / Atalhos -->
    <section class="services-section">
      <h3 class="section-title">O que você precisa?</h3>

      <!-- Botão Informações Acadêmicas -->
      <article class="service-card" id="btn-academic">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </div>
        <div class="card-content">
          <h4>Informações acadêmica</h4>
          <p>Aulas e horários</p>
        </div>
      </article>

      <!-- Botão Comunicados -->
      <article class="service-card" id="btn-announcements">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div class="card-content">
          <h4>Comunicados</h4>
          <p>2 avisos novos</p>
        </div>
      </article>

      <!-- Botão Recursos PCD -->
      <article class="service-card" id="btn-pcd">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="4" r="2"/><path d="M12 6v8m0 0l-3 6m3-6l3 6M6 10h12"/></svg>
        </div>
        <div class="card-content">
          <h4>Recursos PCD</h4>
          <p>Visual, áudio e Libras</p>
        </div>
      </article>
    </section>

    <!-- Botão Pedir Ajuda -->
    <div class="help-section">
      <button class="btn-help" id="btn-help">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>Pedir Ajuda</span>
      </button>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <button class="nav-item active" id="nav-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Início</span>
      </button>

      <button class="nav-item" id="nav-report">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FF383C" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span class="alert-text">Reporte</span>
      </button>

      <button class="nav-item" id="nav-profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Perfil</span>
      </button>
    </nav>

  </main>

  <script src="script.js"></script>
</body>
</html>
